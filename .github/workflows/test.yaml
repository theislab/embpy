name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Primary gate: the lightweight core install (no torch / transformers / pysam
  # / biopython / scanpy). The test suite auto-skips the parts that need those
  # optional dependencies, so this job verifies the core package quickly and
  # without any heavy / build-fragile wheels.
  core:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.12"
            pip-flags: "--pre"
            name: PRE-RELEASE DEPENDENCIES

    name: core ${{ matrix.name }} Python ${{ matrix.python }}

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install build tooling
        run: python -m pip install --upgrade pip wheel
      - name: Install embpy (lightweight core + test extras)
        run: pip install ${{ matrix.pip-flags }} ".[test]"
      - name: Test
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
        run: |
          coverage run -m pytest -v --color=yes
      - name: Report coverage
        run: |
          coverage report
      - name: Upload coverage
        uses: codecov/codecov-action@v3

  # Full install: adds the model backends (CPU torch + transformers + PyG) so
  # the torch-gated tests (model wrappers, BioEmbedder) also run. Heavier, so it
  # runs on a single Python version.
  full:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -e {0}
    name: full Python 3.12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - name: Install build tooling
        run: python -m pip install --upgrade pip wheel
      - name: Install embpy with model backends (CPU torch)
        run: pip install ".[test,models]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        env:
          MPLBACKEND: agg
          PLATFORM: ubuntu-latest
          DISPLAY: :42
        run: |
          coverage run -m pytest -v --color=yes
      - name: Report coverage
        run: |
          coverage report
