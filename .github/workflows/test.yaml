name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
            extras: ".[dev,test,models]"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
            pythonutf8: "0"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.12"
            pip-flags: "--pre"
            name: PRE-RELEASE DEPENDENCIES

    name: ${{ matrix.os }} Python ${{ matrix.python }} ${{ matrix.name }}
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}
      PYTHONUTF8: ${{ matrix.pythonutf8 || '1' }}
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
      MPLBACKEND: agg

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install build tooling
        run: python -m pip install --upgrade pip wheel hatch-vcs
        
      - name: Pre-install CPU PyTorch
        run: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install embpy
        run: pip install ${{ matrix.pip-flags }} -e "${{ matrix.extras || '.[dev,test]' }}"

      - name: BioEmbedder smoke test
        run: python -c "from embpy.embedder import BioEmbedder; emb = BioEmbedder(device='auto')"

      - name: Test
        run: coverage run -m pytest -v --color=yes

      - name: Report coverage
        run: coverage report

  # The main matrix installs .[dev,test] without the MCP SDK, so the MCP tests
  # skip there. This job installs it and sets EMBPY_REQUIRE_MCP=1, which turns
  # those skips into failures, then drives the server through a real MCP client
  # over stdio at both ends of the supported SDK range (pyproject: mcp>=1.23,<3).
  test-mcp:
    name: MCP server (${{ matrix.os }}, mcp ${{ matrix.mcp }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mcp: "1.23.0" # lowest supported
          - os: ubuntu-latest
            mcp: "1.30.0" # latest 1.x
          - os: ubuntu-latest
            mcp: "2.3.0" # latest 2.x
            verify: true
          # 1.x stdio on Windows deadlocked on scipy's Fortran runtime before
          # embpy.mcp.server preloaded it; keep this combination covered.
          - os: windows-latest
            mcp: "1.30.0"
    env:
      EMBPY_REQUIRE_MCP: "1"
      PYTHONUTF8: "1"
      MPLBACKEND: agg
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - name: Install build tooling
        run: python -m pip install --upgrade pip wheel hatch-vcs
      - name: Pre-install CPU PyTorch
        run: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Install embpy with the MCP SDK
        run: pip install -e ".[mcp,test,scib,eval]" "mcp==${{ matrix.mcp }}"
      - name: Show MCP SDK version
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: MCP tool and real-client tests
        run: >-
          pytest -v --color=yes
          tests/test_mcp.py tests/test_mcp_client.py tests/test_resolvers.py
          tests/embpy/test_gene_resolver_exact_lookup.py
      - name: End-to-end verification script
        if: ${{ matrix.verify }}
        run: python verify_full_ecosystem.py

  # Runs every example in the Python-API Agent Skills (skills/*/SKILL.md) on
  # small generated datasets. They download small models and call Ensembl,
  # UniProt, PubChem and ChEMBL, so a failure can be a network problem:
  # reported, but not blocking.
  skill-examples:
    name: Agent Skill examples
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      EMBPY_RUN_SKILL_EXAMPLES: "1"
      PYTHONUTF8: "1"
      MPLBACKEND: agg
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"
      - name: Install
        run: |
          python -m pip install --upgrade pip wheel hatch-vcs
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[mcp,test,eval]"
      - name: Skill checks and examples
        run: pytest -v --color=yes tests/test_skills.py tests/test_skill_examples.py

  # Runs the README's [cpu] install (Option A: pip, Option B: uv) on the PR's own
  # checkout, then checks that it really gave the CPU build of PyTorch -- the
  # CUDA build is ~3 GB and is what [cpu] used to pull on Linux (issue #46).
  test-readme-install:
    name: README Install Test (${{ matrix.installer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installer: [pip, uv]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git tags
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        if: matrix.installer == 'uv'
        uses: astral-sh/setup-uv@v6
      - name: Install as README Option A (pip)
        if: matrix.installer == 'pip'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[cpu]"
      - name: Install as README Option B (uv)
        if: matrix.installer == 'uv'
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install ".[cpu]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify the CPU build of PyTorch and one real embedding
        run: |
          python -c "import torch; assert torch.__version__.endswith('+cpu'), f'expected the CPU build, got torch {torch.__version__}'"
          python -c "import embpy, torch; print(embpy.__version__, torch.__version__)"
          python -c "from embpy import BioEmbedder; a = BioEmbedder(device='cpu').embed(['CCO'], entity_type='molecule', id_type='smiles', model='morgan_fp', output='anndata'); print(a)"
