name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
            extras: ".[dev,test,models]"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
            pythonutf8: "0"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.12"
            pip-flags: "--pre"
            name: PRE-RELEASE DEPENDENCIES

    name: ${{ matrix.os }} Python ${{ matrix.python }} ${{ matrix.name }}
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}
      PYTHONUTF8: ${{ matrix.pythonutf8 || '1' }}
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
      MPLBACKEND: agg

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install build tooling
        run: python -m pip install --upgrade pip wheel hatch-vcs
        
      - name: Pre-install CPU PyTorch
        run: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install embpy
        run: pip install ${{ matrix.pip-flags }} -e "${{ matrix.extras || '.[dev,test]' }}"

      - name: BioEmbedder smoke test
        run: python -c "from embpy.embedder import BioEmbedder; emb = BioEmbedder(device='auto')"

      - name: Test
        run: coverage run -m pytest -v --color=yes

      - name: Report coverage
        run: coverage report

  # Runs the README's [cpu] install (Option A: pip, Option B: uv) on the PR's own
  # checkout, then checks that it really gave the CPU build of PyTorch -- the
  # CUDA build is ~3 GB and is what [cpu] used to pull on Linux (issue #46).
  test-readme-install:
    name: README Install Test (${{ matrix.installer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        installer: [pip, uv]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git tags
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        if: matrix.installer == 'uv'
        uses: astral-sh/setup-uv@v6
      - name: Install as README Option A (pip)
        if: matrix.installer == 'pip'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[cpu]"
      - name: Install as README Option B (uv)
        if: matrix.installer == 'uv'
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install ".[cpu]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify the CPU build of PyTorch and one real embedding
        run: |
          python -c "import torch; assert torch.__version__.endswith('+cpu'), f'expected the CPU build, got torch {torch.__version__}'"
          python -c "import embpy, torch; print(embpy.__version__, torch.__version__)"
          python -c "from embpy import BioEmbedder; a = BioEmbedder(device='cpu').embed(['CCO'], entity_type='molecule', id_type='smiles', model='morgan_fp', output='anndata'); print(a)"
