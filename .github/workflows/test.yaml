name: Test

on:
  push:
    branches: [main, vibe_embpy]
  pull_request:
    branches: [main, vibe_embpy]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
            extras: ".[dev,test,models]"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
            pythonutf8: "0"
          - os: windows-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.12"
            pip-flags: "--pre"
            name: PRE-RELEASE DEPENDENCIES

    name: ${{ matrix.os }} Python ${{ matrix.python }} ${{ matrix.name }}
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}
      PYTHONUTF8: ${{ matrix.pythonutf8 || '1' }}
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
      MPLBACKEND: agg

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install build tooling
        run: python -m pip install --upgrade pip wheel hatch-vcs
        
      - name: Pre-install CPU PyTorch
        run: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install embpy
        run: pip install ${{ matrix.pip-flags }} -e "${{ matrix.extras || '.[dev,test]' }}"

      - name: BioEmbedder smoke test
        run: python -c "from embpy.embedder import BioEmbedder; emb = BioEmbedder(device='auto')"

      - name: Test
        run: coverage run -m pytest -v --color=yes

      - name: Report coverage
        run: coverage report

  test-readme-install:
    name: README Install Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactly as README specifies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[models]"
      - name: Verify
        run: python -c "import embpy, torch; from embpy import BioEmbedder; print(embpy.__version__, torch.__version__)"
