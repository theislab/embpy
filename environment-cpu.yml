# Conda/mamba environment for embpy with CPU-only PyTorch.
# -----------------------------------------------------------------------------
# Usage:
#   mamba env create -f environment-cpu.yml
#   mamba activate embpy-cpu
#
# For a fully reproducible (lockfile-backed) install, prefer pixi.toml:
#   pixi install && pixi shell
# -----------------------------------------------------------------------------
name: embpy-cpu
channels:
  - conda-forge
  - bioconda
  - pytorch
dependencies:
  - python>=3.11,<3.14
  - pip>=24.0

  # Scientific stack -- aligned with pyproject.toml (numpy 2.x).
  - numpy>=1.26,<3
  - pandas>=2.3
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib-base
  - seaborn
  - pyarrow>=15

  # AnnData / scverse
  - anndata
  - scanpy>=1.10

  # PyTorch (CPU-only). pre-built from the pytorch channel, so we do NOT
  # install torch via pip afterwards.
  - pytorch::pytorch>=2.5.1
  - pytorch::cpuonly

  # Binary bioinformatics deps (pip versions are fragile).
  - conda-forge::biopython
  - conda-forge::pyensembl>=2.3.13
  - conda-forge::rdkit
  - bioconda::pysam>=0.22

  # Pure-Python extras via pip. Caduceus/evo2/boltz are skipped because they
  # need CUDA -- add them explicitly later if you have a GPU machine.
  - pip:
      - broad-babel>=0.1
      - -e ".[ppi,pertpy]"
