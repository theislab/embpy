# ---------------------------------------------------------------------------
# world_model -- perturbation world model on top of embpy.
#
# Layout note: the package directory IS this directory (src/world_model/),
# so hatchling needs to be told that the on-disk contents map to the
# `world_model` import name. The `tool.hatch.build.targets.wheel.sources`
# block does exactly that: every path in this directory is prefixed with
# `world_model/` in the built wheel, so `__init__.py` is installed as
# `world_model/__init__.py`. This is the workspace fallback path
# documented in docs/audit/package_split.md.
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world_model"
version = "0.0.1"
description = "Perturbation world model for single-cell transcriptomics, built on embpy."
readme = "README.md"
license = { file = "../../LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Goncalo Rei Pinto", email = "goncalo.pinto@helmholtz-munich.de" },
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "embpy",
  "numpy>=1.26,<3",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "anndata",
  "matplotlib",
  "seaborn",
  "tqdm",
]

# Experiment-only extras live here (state / stack / seqmodels backbones)
# instead of on embpy, because they are only meaningful when actually
# training or evaluating a world model.
optional-dependencies.state = [
  "arc-state>=0.10",
]
optional-dependencies.stack = [
  "arc-stack>=0.1.3",
  "scvi-tools>=1.2",
]
optional-dependencies.seqmodels = [
  "borzoi-pytorch>=0.4.3",
  "enformer-pytorch>=0.8.10",
]
optional-dependencies.test = [
  "pytest",
  "pytest-mock",
  "coverage",
]

urls.Source = "https://github.com/grpinto/embpy"

[tool.hatch.build.targets.wheel]
# Files relative to this directory that go into the wheel. Anything not
# listed here is excluded (so .pyc, __pycache__, sbatch logs etc. stay
# out of the published artefact).
include = [
  "__init__.py",
  "README.md",
  "configs/**/*.py",
  "configs/**/*.yaml",
  "configs/**/*.yml",
  "data/**/*.py",
  "evaluation/**/*.py",
  "models/**/*.py",
  "training/**/*.py",
  "utils/**/*.py",
  "scripts/**/*.py",
  "scripts/**/*.sbatch",
  "scripts/**/*.sh",
  "assets/**/*.png",
]
# Remap on-disk paths to wheel paths: everything here becomes world_model/...
[tool.hatch.build.targets.wheel.sources]
"" = "world_model"

[tool.pytest.ini_options]
# Resolved relative to this pyproject.toml when invoked as
#   pytest --rootdir=src/world_model
# CI typically uses `pytest tests/world_model` from the repo root, in
# which case pytest falls back to the root pyproject's ini_options.
testpaths = ["../../tests/world_model"]
xfail_strict = true
addopts = ["--import-mode=importlib"]
