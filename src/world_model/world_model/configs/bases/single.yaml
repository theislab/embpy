seed: 0
mode: "single"

data:
  dataset: ""
  h5ad_path: ""
  state_obsm_key: "X_state"
  perturbation_key: "perturbation"
  control_label: "control"
  stack_size: 4
  sequence_length: 8
  n_pert: 2
  incontext_support_strategy: "random"
  batch_size: 64
  num_workers: 4
  pin_memory: true

action_embedding:
  source: "anndata_obsm"
  obsm_key: "X_pert"

state_backbone:
  kind: "local"
  freeze: true

split:
  split_by: "perturbation"
  train_fraction: 0.8
  seed: 0

encoder:
  kind: "transformer"
  d_model: 256
  n_layers: 2
  n_heads: 4
  dropout: 0.1
  layer_norm: true

dynamics:
  kind: "gpt"
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_sequence_length: 64
  use_action_token: true
  latent_normalization: "none"
  prediction_mode: "absolute"
  residual_output_init_scale: 0.01

loss:
  latent_mse: 1.0
  decoder_mse: 0.5
  info_nce: 0.1
  info_nce_temperature: 0.1

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.95]
  grad_clip: 1.0
  scheduler: "cosine"
  warmup_steps: 1000

train:
  n_epochs: 50
  log_every_n_steps: 50
  eval_every_n_epochs: 1
  save_every_n_epochs: 5
  device: "auto"
  amp: true
  enable_tensorboard: true
  enable_csv_log: true
  run_eval_after_fit: true

eval:
  n_control_samples_per_pert: 32
  use_cell_eval: true
  require_cell_eval: false
  cell_eval_profile: full
  cell_eval_num_threads: 1
  deg_top_k: 50
  save_predictions: true
