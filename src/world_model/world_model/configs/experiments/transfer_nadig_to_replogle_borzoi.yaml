# Transfer: pretrain on FULL Nadig, fine-tune on p% of Replogle, using
# Borzoi DNA embeddings as the action encoder for BOTH phases.
#
# Diff vs transfer.yaml:
#   * action_embedding.source  precomputed -> bio_embedder (borzoi_v0)
#   * data.gene_embedding_path                 -> "" (unused; bio_embedder)
#   * transfer.pretrain_gene_embedding_path    -> "" (unused; bio_embedder)
#
# A single action_embedding block applies to BOTH phases, so the pretrain
# (Nadig) and fine-tune (Replogle) runs share ONE Borzoi cache file
# (runs/_cache/action_embeddings/borzoi_v0/full_mean_human.npz). Pre-warm
# that cache for both gene panels before submitting -- the companion
# submit_transfer_borzoi.sh does this automatically.

run_name: "transfer_nadig_to_replogle_borzoi_p10"
output_dir: "runs/world_model/transfer_nadig_to_replogle_borzoi_p10"
seed: 0
mode: "transfer"

# 'data' is the FINE-TUNE / target dataset (Replogle).
data:
  dataset: "replogle"
  h5ad_path: "data/datasets/replogle/replogle_2022_k562_essential.h5ad"
  gene_embedding_path: "" # unused: action_embedding.source = bio_embedder
  perturbation_key: "perturbation"
  # Nadig (jurkat) AND Replogle (k562 essential) both label controls
  # exactly "control". The dataset loader does an EXACT string match
  # (perturbation_labels == control_label), so "non-targeting" matches
  # zero cells and aborts in base.py:__init__. One block is shared by
  # the pretrain (Nadig) and fine-tune (Replogle) phases, so this value
  # must be correct for both -> "control".
  control_label: "control"
  cell_type_key: "cell_type"
  n_top_genes: 5000
  log_normalize: true
  stack_size: 4
  sequence_length: 8
  n_pert: 2
  batch_size: 64
  val_fraction: 0.1
  num_workers: 4
  pin_memory: true

# Frozen Borzoi (DNA foundation model) + trainable adapter, shared by the
# Nadig pretrain phase and the Replogle fine-tune phase.
action_embedding:
  source: "bio_embedder"
  model_name: "borzoi_v0"
  organism: "human"
  id_type: "symbol"
  region: "full"
  pooling_strategy: "mean"
  resolver_backend: "api"
  device: "auto"
  cache_dir: "runs/_cache/action_embeddings"

state_backbone:
  kind: "local"
  freeze: true

split:
  split_by: "perturbation"
  train_fraction: 0.8
  seed: 0

transfer:
  enabled: true
  pretrain_dataset: "nadig"
  pretrain_h5ad_path: "data/datasets/nadig/NadigOConner2024_jurkat.h5ad"
  pretrain_gene_embedding_path: "" # unused: action_embedding.source = bio_embedder
  pretrain_epochs: 30
  finetune_fraction: 0.10
  finetune_epochs: 20
  pretrain_checkpoint: null
  freeze_encoder_during_finetune: false
  freeze_dynamics_during_finetune: false

encoder:
  kind: "transformer"
  d_model: 256
  n_layers: 2
  n_heads: 4
  dropout: 0.1

dynamics:
  kind: "gpt"
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_sequence_length: 64
  use_action_token: true

loss:
  latent_mse: 1.0
  decoder_mse: 0.5
  info_nce: 0.1
  info_nce_temperature: 0.1

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.95]
  grad_clip: 1.0
  scheduler: "cosine"
  warmup_steps: 1000

train:
  n_epochs: 20         # only used if you bypass transfer.* above
  log_every_n_steps: 50
  eval_every_n_epochs: 1
  save_every_n_epochs: 5
  device: "auto"
  amp: true
  enable_tensorboard: true
  enable_csv_log: true

eval:
  n_control_samples_per_pert: 32
  use_cell_eval: true
  deg_top_k: 50
  save_predictions: true
