# Replogle (K562 essential) -- IN-CONTEXT model, EXPLICIT 3-token triplets.
#
# Identical task/data/loss to single_replogle_incontext.yaml; the only
# change is dynamics.kind: incontext_set -> incontext_tokens. Each triplet
# becomes THREE tokens (s, a, s') with type + role + per-triplet group
# embeddings, bidirectional (non-causal), permutation-invariant across
# triplets -- the literal "context-SSL over triplets" architecture. A/B
# this against single_replogle_incontext.yaml (fused one-token-per-triplet).
#
# Submit:
#   sbatch src/world_model/world_model/scripts/slurm/train_embedding.sbatch \
#     src/world_model/world_model/configs/experiments/single_replogle_incontext_tokens.yaml

run_name: "single_replogle_incontext_tokens"
output_dir: "runs/world_model/single_replogle_incontext_tokens"
seed: 0
mode: "single"

data:
  dataset: "replogle"
  h5ad_path: "data/datasets/replogle/replogle_2022_k562_essential.h5ad"
  gene_embedding_path: "data/embeddings/gene_embeddings/genept/embeddings_3072.csv"
  perturbation_key: "perturbation"
  control_label: "control"
  cell_type_key: "cell_type"
  n_top_genes: 5000
  log_normalize: true
  stack_size: 4
  sequence_length: 8          # unused in incontext mode
  n_pert: 2
  context_mode: "incontext_set"
  incontext_support_size: 64  # 3*(64+1)=195 tokens per task
  sequence_bucket_key: "batch"
  batch_size: 32
  val_fraction: 0.1
  num_workers: 8
  pin_memory: true

action_embedding:
  source: "precomputed"
  path: ""

state_backbone:
  kind: "local"
  freeze: false

split:
  split_by: "perturbation"
  train_fraction: 0.8
  seed: 0

encoder:
  kind: "transformer"
  d_model: 256
  n_layers: 2
  n_heads: 4
  dropout: 0.1

# Explicit 3-token-per-triplet bidirectional set transformer.
dynamics:
  kind: "incontext_tokens"
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_sequence_length: 64     # max #triplets cap (tokens = 3x this internally)
  use_action_token: true

loss:
  latent_mse: 1.0
  decoder_mse: 0.5
  info_nce: 0.1
  info_nce_temperature: 0.1
  action_counterfactual: 0.5
  action_counterfactual_temperature: 0.1

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.95]
  grad_clip: 1.0
  scheduler: "cosine"
  warmup_steps: 1000

train:
  n_epochs: 50
  log_every_n_steps: 50
  eval_every_n_epochs: 1
  save_every_n_epochs: 5
  device: "auto"
  amp: true
  enable_tensorboard: true
  enable_csv_log: true

eval:
  n_control_samples_per_pert: 32
  use_cell_eval: true
  deg_top_k: 50
  save_predictions: true
