# Nadig (jurkat) -- IN-CONTEXT model, EXPLICIT 3-token triplets.
# Nadig twin of single_replogle_incontext_tokens.yaml.
#
# Submit:
#   sbatch src/world_model/world_model/scripts/slurm/train_embedding.sbatch \
#     src/world_model/world_model/configs/experiments/single_nadig_incontext_tokens.yaml

run_name: "single_nadig_incontext_tokens"
output_dir: "runs/world_model/single_nadig_incontext_tokens"
seed: 0
mode: "single"

data:
  dataset: "nadig"
  h5ad_path: "data/datasets/nadig/NadigOConner2024_jurkat.h5ad"
  gene_embedding_path: "" # deprecated; use action_embedding.store_path
  perturbation_key: "perturbation"
  control_label: "control"
  cell_type_key: null
  n_top_genes: 5000
  log_normalize: true
  stack_size: 4
  sequence_length: 8 # unused in incontext mode
  n_pert: 2
  context_mode: "incontext_set"
  incontext_support_size: 64
  sequence_bucket_key: "batch"
  batch_size: 32
  val_fraction: 0.1
  num_workers: 8
  pin_memory: true

action_embedding:
  source: "store"
  store_path: "data/embeddings/gene_embeddings/genept/genept.emstore"
  store_key: "gene:genept"

state_backbone:
  kind: "local"
  freeze: false

split:
  split_by: "perturbation"
  train_fraction: 0.8
  seed: 0

encoder:
  kind: "transformer"
  d_model: 256
  n_layers: 2
  n_heads: 4
  dropout: 0.1

dynamics:
  kind: "incontext_tokens"
  d_model: 256
  n_layers: 6
  n_heads: 8
  dropout: 0.1
  max_sequence_length: 64
  use_action_token: true

loss:
  latent_mse: 1.0
  decoder_mse: 0.5
  info_nce: 0.1
  info_nce_temperature: 0.1
  action_counterfactual: 0.5
  action_counterfactual_temperature: 0.1

optim:
  lr: 3.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.95]
  grad_clip: 1.0
  scheduler: "cosine"
  warmup_steps: 1000

train:
  n_epochs: 50
  log_every_n_steps: 50
  eval_every_n_epochs: 1
  save_every_n_epochs: 5
  device: "auto"
  amp: true
  enable_tensorboard: true
  enable_csv_log: true

eval:
  n_control_samples_per_pert: 32
  use_cell_eval: true
  deg_top_k: 50
  save_predictions: true
