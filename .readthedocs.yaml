# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # Install a real, CPU-only torch before the docs deps. autosummary imports
    # embpy.pl -> seaborn -> scipy.stats, and modern scipy calls
    # issubclass(x, torch.Tensor) at import time; a mocked torch (a non-class
    # Mock) makes that raise. Real torch avoids it, and the CPU wheel keeps the
    # build small enough for Read the Docs.
    pre_install:
      - pip install "torch>=2.5.1" --index-url https://download.pytorch.org/whl/cpu
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
