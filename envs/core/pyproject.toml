# uv project for the CORE model family (embpy).
# Base transformers (4.45–<5) + numpy 2 island: ESM2, ProtT5, HF-DNA (HyenaDNA,
# GENA-LM, NT v1/v2), molecule LMs (ChemBERTa, MolFormer, RDKit, MHG-GNN, MolE),
# text, PPI, morphology (SubCell). Everything here co-resolves; the conflicting
# models live in their own sibling env dirs.
[project]
name = "embpy-env-core"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "embpy[torch,ppi,morphology,scanpy]",
]

[tool.uv.sources]
embpy = { path = "../..", editable = true }

[tool.uv]
package = false
